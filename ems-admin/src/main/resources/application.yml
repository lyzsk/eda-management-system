server:
  port: 1115

spring:
  application:
    name: ems-admin
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ems?currentSchema=ems}
    username: ${DB_USERNAME:ems}
    password: ${DB_PASSWORD:ems}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

ems:
  jwt:
    secret: ${JWT_SECRET:ems-dev-only-secret-0123456789abcdef}
    issuer: ems
    access-token-ttl-minutes: ${JWT_TTL_MINUTES:480}

logging:
  level:
    cn.sichu: info
